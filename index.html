<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação de Presença</title>

        <!-- Favicon -->
    <link rel="shortcut icon" href="logo-icon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="l-r-wrapper">
        <img src="left2.png" class="left" alt="">
        <img src="right2.png" class="right" alt="">
    </div>
    
    <section class="container">

        <div class="nome"></div>

        <span>Confirmação de Presença</span>

        <form id="rsvp">

            <label class="name-label">Nome completo</label>

            <input
                type="text"
                id="nome"
                required
            >

            <label class="question-label">Você irá comparecer?</label>

            <div class="radio-group">

                <label>
                    <input
                        type="radio"
                        name="presenca"
                        value="Sim"
                        required
                    >

                    Sim, estarei presente
                </label>

                <label>
                    <input
                        type="radio"
                        name="presenca"
                        value="Não"
                    >

                    Infelizmente não poderei comparecer
                </label>

            </div>

            <button type="submit">

                <img src="pointing.png" width="20px" height="20px">

                Confirmar Presença

            </button>

        </form>

        <div class="success" id="success">

            <h2>Obrigado!</h2>

            <p class="success-message">
                Sua confirmação foi recebida com sucesso!
            </p>

        </div>

    </section>

    <footer>

    27 de Fevereiro de 2027 • Sofia Russo | 15 anos

    </footer>

    <script src="script.js"></script>

</body>
</html>
