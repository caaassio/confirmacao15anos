<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação de Presença</title>

        <!-- Favicon -->
    <link rel="shortcut icon" href="logo-icon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cormorant:ital,wght@0,300..700;1,300..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="container">

    <div class="nome"></div>

    <span>Confirmação de Presença</span>

    <p>
        Sua presença tornará essa noite ainda mais especial.
        <br>
        Confirme até 15/02/2027.
    </p>

    <span class="arabesco"></span>

    <form id="rsvp">

        <label class="name-label">Nome completo</label>

        <input
            type="text"
            id="nome"
            required
        >

        <label class="question-label">Você irá comparecer?</label>

        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="presenca"
                    value="Sim"
                    required
                >

                Sim, estarei presente
            </label>

            <label>
                <input
                    type="radio"
                    name="presenca"
                    value="Não"
                >

                Infelizmente não poderei comparecer
            </label>

        </div>

        <button type="submit">

            Confirmar Presença

        </button>

    </form>

    <div class="success" id="success">

    <div class="divider"></div>

        <h2>Obrigado!</h2>

        <p>
            Sua confirmação foi recebida com sucesso.
            <br>
            Esperamos você para uma noite inesquecível.
        </p>

    <div class="divider"></div>

</div>

</section>

<footer>

23 de Fevereiro de 2027 • Buffet Castelo

</footer>

<script src="script.js"></script>

</body>
</html>
